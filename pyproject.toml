[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rains"
version = "1.0.0"
description = "RAINS: NSGA-II optimisation of Natural Flood Management (NFM) location and size with the SHETRAN hydrological model"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Asid Ur Rehman" },
    { name = "Elizabeth Lewis" },
    { name = "Ben Smith" },
    { name = "Steve Birkinshaw" },
]
requires-python = ">=3.10"
keywords = ["natural flood management", "NFM", "SHETRAN", "NSGA-II",
            "multi-objective optimisation", "hydrology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# Keep in step with requirements.txt
dependencies = [
    "numpy>=1.23",
    "pandas>=2.2,<3",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "openpyxl>=3.0",
    "plotly>=5.0",
    "hydroeval>=0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/asidurrehman/RAINS"
Issues = "https://github.com/asidurrehman/RAINS/issues"

[tool.setuptools]
# The optimisation itself is run as a script (rains_main.py); installing the
# project makes the two function modules importable from anywhere.
py-modules = ["rains_all_functions", "SHETRAN_Post_Simulation_Functions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["venv*", ".venv*"]

[tool.ruff.lint]
# Syntax errors and undefined names only; style is left as written.
select = ["E9", "F63", "F7", "F82"]
